name: Sync IRS Business Master File

# Adds public charities that no funder's grant records name yet, and IRS
# legal names for search (scripts/sync-irs-bmf.js). The IRS updates the BMF
# monthly, usually in the second week.

on:
  schedule:
    # The 16th of each month at 10:17 UTC.
    - cron: '17 10 16 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Download and count rows without writing (1 or 0)
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: sync-irs-bmf
  cancel-in-progress: false

jobs:
  sync-irs-bmf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify secrets are configured
        env:
          HAS_SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          if [ "$HAS_SUPABASE_KEY" != "true" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY secret is not configured. Go to Settings > Secrets and variables > Actions to add it."
            exit 1
          fi

      - name: Sync IRS BMF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: node scripts/sync-irs-bmf.js
