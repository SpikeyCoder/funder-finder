name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --include=optional
      - name: Audit high/critical advisories (informational)
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit found high/critical advisories; review before merging"
      - name: Lint (rules of hooks)
        run: npm run lint
      - run: npm run build
      - name: Verify static prerender coverage
        # Asserts the built dist/<route>/index.html pages carry real crawler-
        # visible content (h1, meta, canonical, OG, JSON-LD, body copy).
        # Pure Node + jsdom — no headless browser needed in CI.
        run: npm test
      - name: Edge Function unit tests (Deno)
        # The crash/SLA monitoring functions and the shared helpers they use.
        # Deno from its official npm package, at a pinned version.
        run: >-
          npx --yes deno@2.9.6 test --no-lock --node-modules-dir=none --allow-env
          supabase/functions/monitor-report supabase/functions/monitor-sweep
          supabase/functions/process-organization-requests supabase/functions/request-organization
          supabase/functions/_shared/cron_auth_test.ts supabase/functions/_shared/trello_test.ts
          supabase/functions/_shared/rest_test.ts
